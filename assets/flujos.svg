epeatCount="indefinite"><mpath href="#p290_2"/></animateMotion></circle><circle r="5" fill="#F97316"><animateMotion dur="1.8s" begin="2.5s" repeatCount="indefinite"><mpath href="#p290_2"/></animateMotion></circle>
