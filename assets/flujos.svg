<text x="50" y="68" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="3" fill="#60A5FA">// FLUJO DE BOLETAJE</text><rect x="50" y="85" width="200" height="70" rx="12" fill="#0D1117" stroke="#60A5FA" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect><text x="150" y="116" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#F4F4F5">Compra</text><text x="150" y="138" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#A1A1AA">checkout + pagos</text><rect x="350" y="85" width="200" height="70" rx="12" fill="#0D1117" stroke="#60A5FA" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" begin="0.8s" repeatCount="indefinite"/></rect><text x="450" y="116" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#F4F4F5">API NestJS</text><text x="450" y="138" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#A1A1AA">reglas de negocio</text><rect x="650" y="85" width="200" height="70" rx="12" fill="#0D1117" stroke="#60A5FA" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" begin="1.6s" repeatCount="indefinite"/></rect><text x="750" y="116" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#F4F4F5">MySQL</text><text x="750" y="138" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#A1A1AA">boletos y eventos</text><rect x="950" y="85" width="200" height="70" rx="12" fill="#0D1117" stroke="#60A5FA" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" begin="2.4s" repeatCount="indefinite"/></rect><text x="1050" y="116" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#F4F4F5">QR de acceso</text><text x="1050" y="138" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#A1A1AA">validación en puerta</text><path id="p120_0" d="M250 120H350" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6 6" fill="none" stroke-opacity=".6"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path><polygon points="341,114 350,120 341,126" fill="#60A5FA"/><circle r="5" fill="#60A5FA"><animateMotion dur="1.8s" begin="0.0s" repeatCount="indefinite"><mpath href="#p120_0"/></animateMotion></circle><circle r="5" fill="#60A5FA"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#p120_0"/></animateMotion></circle><path id="p120_1" d="M550 120H650" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6 6" fill="none" stroke-opacity=".6"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path><polygon points="641,114 650,120 641,126" fill="#60A5FA"/><circle r="5" fill="#60A5FA"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#p120_1"/></animateMotion></circle><circle r="5" fill="#60A5FA"><animateMotion dur="1.8s" begin="1.5s" repeatCount="indefinite"><mpath href="#p120_1"/></animateMotion></circle><path id="p120_2" d="M850 120H950" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6 6" fill="none" stroke-opacity=".6"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path><polygon points="941,114 950,120 941,126" fill="#60A5FA"/><circle r="5" fill="#60A5FA"><animateMotion